<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Eficiência paralela — MPI + OpenMP v1</title>
<desc id="descricao">Eficiência paralela — MPI + OpenMP v1. Dois painéis para 20 e 50 milhões de elementos; configurações categóricas de processos MPI × threads OpenMP por processo: 1 × 4, 2 × 4, 2 × 8 e 4 × 4. Tempos da Fase 1, média de cinco repetições após um aquecimento. Baseline histórico. Escala comum de 0 a 110%. Eficiência = baseline / (processos × threads por processo × tempo paralelo) × 100; não representa ocupação da CPU.</desc>
