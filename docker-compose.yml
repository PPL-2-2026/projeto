# Uso:
#   docker compose run --rm baseline
#   docker compose run --rm openmpv1
#   docker compose run --rm openmpv2
#   docker compose run --rm perfilamento
#   N=1000000 docker compose run --rm openmpv2      # tamanho do vetor
#   THREADS=8 docker compose run --rm openmpv2      # threads OpenMP
#
# O código é montado como volume e compilado a cada execução,
# então não é preciso rebuild da imagem ao editar os .cpp.

x-cpp: &cpp
  build: .
  image: ordenacao-cpp
  working_dir: /app
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app
  environment:
    OMP_NUM_THREADS: ${THREADS:-4}

services:
  baseline:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -o bin/baseline "baseline e perfilamento/baseline.cpp" &&
             ./bin/baseline ${N:-20000000}'

  openmpv1:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -fopenmp -o bin/openmpv1 OpenMP/v1/openmp.cpp &&
             ./bin/openmpv1 ${N:-20000000}'

  openmpv2:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -fopenmp -o bin/openmpv2 OpenMP/v2/openmp.cpp &&
             ./bin/openmpv2 ${N:-20000000}'

  openmpv1perfilamento:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -g -fopenmp -o bin/openmpv1perfilamento OpenMP/v1/openmpV1Perfilamento.cpp &&
             ./bin/openmpv1perfilamento ${N:-20000000} ${REPS:-10} ${AQUEC:-2} ${CORTE:-2160}'

  openmpv2perfilamento:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -g -fopenmp -o bin/openmpv2perfilamento OpenMP/v2/openmpV2Perfilamento.cpp &&
             ./bin/openmpv2perfilamento ${N:-20000000} ${REPS:-10} ${AQUEC:-2} ${CORTE:-2160}'

  perfilamento:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             g++ -O2 -g -fopenmp -o bin/perfilamento "baseline e perfilamento/perfilamento.cpp" &&
             ./bin/perfilamento ${N:-20000000}'


  
  mpi:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             mpicxx -O2 -fopenmp -o bin/mpi MPI/v1/mpi.cpp &&
             mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpi ${N:-20000000}'


  
  mpiperfilamento:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             mpicxx -O2 -g -fopenmp -o bin/mpiperfilamento MPI/v1/mpiV1perfilamento.cpp &&
             mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpiperfilamento ${N:-20000000} ${REPS:-5} ${AQUEC:-1} ${CORTE:-2160}'


  mpirevisado:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             mpicxx -O2 -fopenmp -o bin/mpirevisado MPI/v1revisado/mpi.cpp &&
             mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpirevisado ${N:-20000000}'

  mpiperfilamentorevisado:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             mpicxx -O2 -g -fopenmp -o bin/mpiperfilamentorevisado MPI/v1revisado/mpiV1perfilamento.cpp &&
             mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpiperfilamentorevisado ${N:-20000000} ${REPS:-5} ${AQUEC:-1} ${CORTE:-2160}'

  mpiv2:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
             mpicxx -O2 -fopenmp -o bin/mpiv2 MPI/v2/mpi.cpp &&
             mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpiv2 ${N:-20000000}'
  
  mpiv2perfilamento:
    <<: *cpp
    command: >
      sh -c 'mkdir -p bin &&
            mpicxx -O2 -g -fopenmp -o bin/mpiv2perfilamento MPI/v2/mpiV2perfilamento.cpp &&
            mpirun --oversubscribe --bind-to none -np ${PROCS:-2} ./bin/mpiv2perfilamento ${N:-20000000} ${REPS:-5} ${AQUEC:-1} ${CORTE:-2160}'