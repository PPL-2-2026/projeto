<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Eficiência paralela por número de threads</title>
<desc id="descricao">Comparação de OpenMP v1 e v2 para 20 e 50 milhões de elementos. Eficiência = tempo do baseline / (threads × tempo paralelo) × 100. Ambos os painéis usam escala de 0 a 110%, com referência ideal em 100%. Tempos médios da Fase 1, com dez execuções após duas de aquecimento. Valores acima de 100% são preservados e não demonstram, isoladamente, uma vantagem estatística.</desc>
<rect width="1000" height="520" fill="#ffffff"/>
<!-- Fontes: baseline e perfilamento/perfilamento.md; OpenMP/v1/v1.md; OpenMP/v2/v2.md. Calculado a partir dos tempos, sem arredondamento intermediário do speedup. -->
