<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Eficiência da escalabilidade fraca — OpenMP v2</title>
<desc id="descricao">Um milhão de elementos por thread. Eficiência fraca = tempo com uma thread e um milhão de elementos dividido pelo tempo com p threads e p milhões de elementos, vezes 100. Valores: 100%, 95,81%, 82,79%, 62,96% e 38,71%. Referência de 100% corresponde a tempo constante. Não representa ocupação da CPU.</desc>
<rect width="680" height="480" fill="#ffffff"/>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2230">Eficiência da escalabilidade fraca — OpenMP v2</text>
<text x="340" y="46" text-anchor="middle" font-size="12" fill="#4a5466">1.000.000 de elementos por thread · n = threads × 1.000.000</text>
<line x1="90.00" y1="70.00" x2="118.00" y2="70.00" stroke="#c8721a" stroke-width="2.5"/>
<rect x="100" y="66" width="8" height="8" fill="#c8721a"/>
<text x="126" y="74" fill="#1a2230">Eficiência fraca da v2</text>
<line x1="350.00" y1="70.00" x2="378.00" y2="70.00" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/>
<text x="386" y="74" fill="#1a2230" font-size="12">Referência: 100% (tempo constante)</text>
<line x1="70.00" y1="370.00" x2="650.00" y2="370.00" stroke="#e3e7ee" />
<text x="62" y="374.0" text-anchor="end" fill="#4a5466">0%</text>
<line x1="70.00" y1="345.45" x2="650.00" y2="345.45" stroke="#e3e7ee" />
<text x="62" y="349.45" text-anchor="end" fill="#4a5466">10%</text>
<line x1="70.00" y1="320.91" x2="650.00" y2="320.91" stroke="#e3e7ee" />
<text x="62" y="324.91" text-anchor="end" fill="#4a5466">20%</text>
<line x1="70.00" y1="296.36" x2="650.00" y2="296.36" stroke="#e3e7ee" />
<text x="62" y="300.36" text-anchor="end" fill="#4a5466">30%</text>
<line x1="70.00" y1="271.82" x2="650.00" y2="271.82" stroke="#e3e7ee" />
<text x="62" y="275.82" text-anchor="end" fill="#4a5466">40%</text>
<line x1="70.00" y1="247.27" x2="650.00" y2="247.27" stroke="#e3e7ee" />
<text x="62" y="251.27" text-anchor="end" fill="#4a5466">50%</text>
<line x1="70.00" y1="222.73" x2="650.00" y2="222.73" stroke="#e3e7ee" />
<text x="62" y="226.73" text-anchor="end" fill="#4a5466">60%</text>
<line x1="70.00" y1="198.18" x2="650.00" y2="198.18" stroke="#e3e7ee" />
<text x="62" y="202.18" text-anchor="end" fill="#4a5466">70%</text>
<line x1="70.00" y1="173.64" x2="650.00" y2="173.64" stroke="#e3e7ee" />
<text x="62" y="177.64" text-anchor="end" fill="#4a5466">80%</text>
<line x1="70.00" y1="149.09" x2="650.00" y2="149.09" stroke="#e3e7ee" />
<text x="62" y="153.09" text-anchor="end" fill="#4a5466">90%</text>
<line x1="70.00" y1="124.55" x2="650.00" y2="124.55" stroke="#e3e7ee" />
<text x="62" y="128.55" text-anchor="end" fill="#4a5466">100%</text>
<line x1="70.00" y1="100.00" x2="650.00" y2="100.00" stroke="#e3e7ee" />
<text x="62" y="104.0" text-anchor="end" fill="#4a5466">110%</text>
<line x1="106.25" y1="100.00" x2="106.25" y2="370.00" stroke="#e3e7ee" />
<text x="106.25" y="390" text-anchor="middle" fill="#4a5466">1</text>
<text x="106.25" y="407" text-anchor="middle" font-size="11" fill="#4a5466">1M</text>
<line x1="142.50" y1="100.00" x2="142.50" y2="370.00" stroke="#e3e7ee" />
<text x="142.5" y="390" text-anchor="middle" fill="#4a5466">2</text>
<text x="142.50" y="407" text-anchor="middle" font-size="11" fill="#4a5466">2M</text>
<line x1="215.00" y1="100.00" x2="215.00" y2="370.00" stroke="#e3e7ee" />
<text x="215.0" y="390" text-anchor="middle" fill="#4a5466">4</text>
<text x="215.00" y="407" text-anchor="middle" font-size="11" fill="#4a5466">4M</text>
<line x1="360.00" y1="100.00" x2="360.00" y2="370.00" stroke="#e3e7ee" />
<text x="360.0" y="390" text-anchor="middle" fill="#4a5466">8</text>
<text x="360.00" y="407" text-anchor="middle" font-size="11" fill="#4a5466">8M</text>
<line x1="650.00" y1="100.00" x2="650.00" y2="370.00" stroke="#e3e7ee" />
<text x="650.0" y="390" text-anchor="middle" fill="#4a5466">16</text>
<text x="650.00" y="407" text-anchor="middle" font-size="11" fill="#4a5466">16M</text>
<line x1="70.00" y1="370.00" x2="650.00" y2="370.00" stroke="#4a5466" />
<line x1="70.00" y1="100.00" x2="70.00" y2="370.00" stroke="#4a5466" />
<line x1="70.00" y1="124.55" x2="650.00" y2="124.55" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/>
<text x="360" y="435" text-anchor="middle" fill="#1a2230">Threads / elementos (M = milhão de elementos)</text>
<text x="20" y="235" text-anchor="middle" fill="#1a2230" transform="rotate(-90 20 235)">Eficiência fraca (%)</text>
<polyline points="106.25,124.55 142.50,134.84 215.00,166.79 360.00,215.46 650.00,275.00" fill="none" stroke="#c8721a" stroke-width="2.5"/>
<rect x="102.25" y="120.55" width="8" height="8" fill="#c8721a"><title>Threads: 1; elementos: 1000000; eficiência fraca: 100,00%</title></rect>
<text x="106.25" y="112.55" text-anchor="middle" fill="#c8721a" font-size="12">100,00%</text>
<rect x="138.50" y="130.84" width="8" height="8" fill="#c8721a"><title>Threads: 2; elementos: 2000000; eficiência fraca: 95,81%</title></rect>
<text x="150.5" y="154.84" text-anchor="start" fill="#c8721a" font-size="12">95,81%</text>
<rect x="211.00" y="162.79" width="8" height="8" fill="#c8721a"><title>Threads: 4; elementos: 4000000; eficiência fraca: 82,79%</title></rect>
<text x="223" y="186.79" text-anchor="start" fill="#c8721a" font-size="12">82,79%</text>
<rect x="356.00" y="211.46" width="8" height="8" fill="#c8721a"><title>Threads: 8; elementos: 8000000; eficiência fraca: 62,96%</title></rect>
<text x="352.0" y="203.46" text-anchor="end" fill="#c8721a" font-size="12">62,96%</text>
<rect x="646.00" y="271.00" width="8" height="8" fill="#c8721a"><title>Threads: 16; elementos: 16000000; eficiência fraca: 38,71%</title></rect>
<text x="642.0" y="263.0" text-anchor="end" fill="#c8721a" font-size="12">38,71%</text>
<text x="340" y="465" text-anchor="middle" font-size="12" fill="#4a5466">Eficiência fraca = T(1, 1 milhão) / T(p, p milhões) × 100</text>
</svg>
